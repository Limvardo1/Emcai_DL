# Blueprint Render untuk ResumeAI
# Dua web service Docker, plan Free, region Singapore.
# Database dan penyimpanan berkas memakai Supabase (bukan Render).

services:
  - type: web
    name: resumeai-ml
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./services/ml
    dockerfilePath: ./services/ml/Dockerfile
    healthCheckPath: /livez
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: resumeai-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./apps/api
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/livez
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: resumes
      - key: MAX_FILE_MB
        value: "5"
      - key: ML_SERVICE_URL
        value: https://resumeai-ml.onrender.com
      - key: WEB_ORIGIN
        sync: false
